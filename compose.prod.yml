services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: shelf
      POSTGRES_USER: shelf
      POSTGRES_PASSWORD: shelf
    volumes:
      - shelf-prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelf -d shelf"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/vainnor/shelf:latest
    restart: "no"
    environment:
      DATABASE_URL: postgres://shelf:shelf@db:5432/shelf
    depends_on:
      db:
        condition: service_healthy
    command: node scripts/run-migrations.mjs

  app:
    image: ghcr.io/vainnor/shelf:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://shelf:shelf@db:5432/shelf
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      NEXT_PUBLIC_BETTER_AUTH_URL: ${NEXT_PUBLIC_BETTER_AUTH_URL:-http://localhost}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-before-production}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8888:3000"

volumes:
  shelf-prod-postgres: